name: Release & Packaging

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v4.5.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build & Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools libfuse2

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Compile & Production Build
        run: npm run build

      - name: Package with Electron Builder (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $maxAttempts = 3
          for ($i = 1; $i -le $maxAttempts; $i++) {
            Write-Host "Starting Windows packaging (Attempt $i of $maxAttempts)..."
            npx electron-builder --win --x64 --publish never
            if ($LASTEXITCODE -eq 0) {
              Write-Host "Windows packaging completed successfully."
              break
            }
            if ($i -lt $maxAttempts) {
              Write-Warning "Packaging attempt $i failed with exit code $LASTEXITCODE. Waiting 15 seconds before retrying..."
              Start-Sleep -Seconds 15
            } else {
              Write-Error "Windows packaging failed after $maxAttempts attempts."
              exit $LASTEXITCODE
            }
          }

      - name: Package with Electron Builder (Linux)
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in 1 2 3; do
            echo "Starting Linux packaging (Attempt $i of 3)..."
            npx electron-builder --linux AppImage tar.gz --x64 --publish never && break || {
              if [ $i -lt 3 ]; then
                echo "Linux packaging attempt $i failed. Retrying in 15s..."
                sleep 15
              else
                echo "Linux packaging failed after 3 attempts."
                exit 1
              fi
            }
          done

      - name: Generate SHA-256 Checksums (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem release\*.exe, release\*.zip | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -FilePath release\SHA256SUMS_win.txt -Append -Encoding ascii
          }

      - name: Generate SHA-256 Checksums (Linux)
        if: runner.os == 'Linux'
        run: |
          cd release
          sha256sum *.AppImage *.tar.gz > SHA256SUMS_linux.txt 2>/dev/null || true

      - name: Upload Packaged Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.zip
            release/*.AppImage
            release/*.tar.gz
            release/SHA256SUMS_*.txt
          if-no-files-found: error
          retention-days: 2

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download Packaged Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Aggregate Master SHA256SUMS
        run: |
          cd release
          cat SHA256SUMS_*.txt > SHA256SUMS.txt 2>/dev/null || true
          rm -f SHA256SUMS_*.txt
          echo "Generated SHA256SUMS.txt:"
          cat SHA256SUMS.txt

      - name: Determine Release Tag
        id: tag_info
        run: |
          if [ -n "${{ inputs.release_tag }}" ]; then
            echo "tag=${{ inputs.release_tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.tag }}
          name: IndoctrinatedEdit ${{ steps.tag_info.outputs.tag }}
          generate_release_notes: true
          files: |
            release/*.exe
            release/*.zip
            release/*.AppImage
            release/*.tar.gz
            release/SHA256SUMS.txt
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
