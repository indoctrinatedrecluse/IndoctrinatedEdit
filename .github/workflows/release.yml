name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build & Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools libfuse2

      - name: Install Node Dependencies
        run: npm install

      - name: Compile & Build Application
        run: npm run build

      - name: Package with Electron Builder (Windows)
        if: runner.os == 'Windows'
        run: npx electron-builder --win --publish never

      - name: Package with Electron Builder (Linux)
        if: runner.os == 'Linux'
        run: npx electron-builder --linux --publish never

      - name: Publish Artifacts to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Ensure release exists (idempotent across matrix jobs)
          gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --generate-notes || true
          
          # Upload packaged binaries
          for file in release/*.exe release/*.zip release/*.AppImage release/*.tar.gz; do
            if [ -f "$file" ]; then
              echo "Uploading $file to release ${{ github.ref_name }}..."
              gh release upload "${{ github.ref_name }}" "$file" --clobber
            fi
          done
