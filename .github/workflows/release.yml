name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build & Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools libfuse2

      - name: Install Node Dependencies
        run: npm install

      - name: Compile & Build Application
        run: npm run build

      - name: Package with Electron Builder (Windows)
        if: runner.os == 'Windows'
        run: npx electron-builder --win --publish never

      - name: Package with Electron Builder (Linux)
        if: runner.os == 'Linux'
        run: npx electron-builder --linux --publish never

      - name: Upload Packaged Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.zip
            release/*.AppImage
            release/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Download Packaged Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Files to upload:"
          ls -la release/

          # Ensure release is created with release notes
          gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --generate-notes || echo "Release already created, continuing..."

          # Upload all binaries with clobber to safely overwrite
          for file in release/*.exe release/*.zip release/*.AppImage release/*.tar.gz; do
            if [ -f "$file" ]; then
              echo "Uploading $file..."
              gh release upload "${{ github.ref_name }}" "$file" --clobber
            fi
          done
